[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magsearch"
version = "0.1.0"
description = "Search old magazine scans by full-text OCR."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "jinja2>=3.1",
    "pillow>=10.2",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    "itsdangerous>=2.0",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
]
ingest = [
    "pymupdf>=1.24",
    "rarfile>=4.1",
]
desktop = [
    "pywebview>=5.0",
    "pyinstaller>=6.0",
    # pywebview on Linux has no built-in backend — without Qt or GTK
    # bindings it raises WebViewException at start(). Qt bundles cleanly
    # with PyInstaller (GTK relies on system PyGObject + WebKit2GTK), so
    # we ship Qt. macOS and Windows use Cocoa / WebView2 respectively,
    # both pulled in by pywebview itself.
    "qtpy>=2.4; sys_platform == 'linux'",
    "PyQt5>=5.15; sys_platform == 'linux'",
    "PyQtWebEngine>=5.15; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
magsearch = "magsearch.cli:app"
magsearch-desktop = "magsearch.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/magsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: tests that require PaddleOCR (skipped by default; opt in with -m ocr)",
]
addopts = "-m 'not ocr'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
