{% extends "base.html" %}

{% block title %}Import · The Archive{% endblock %}

{% block content %}
<div class="mb-10">
  <p class="caps caps-soft">Acquisitions</p>
  <h1 class="display text-5xl">Import magazines</h1>
  <div class="rule mt-4"></div>
</div>

<form action="/import" method="post" enctype="multipart/form-data" class="space-y-6">
  <label class="block">
    <span class="caps caps-soft">Select one or more .magbundle files</span>
    <input type="file" name="bundles" accept=".magbundle,.zip" multiple required
           class="block mt-3">
  </label>
  <button type="submit" class="btn-editorial">Import</button>
</form>
{% endblock %}
