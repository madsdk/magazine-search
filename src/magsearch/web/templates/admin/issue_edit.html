{% extends "admin/admin_base.html" %}

{% block admin_content %}
<p class="caps caps-soft mb-2">Editing</p>
<h2 class="display text-4xl mb-2">{{ mag.title }}{% if mag.issue %} <span class="display-italic">— {{ mag.issue }}</span>{% endif %}</h2>
<p class="link-italic mb-8">id: {{ mag.id }}</p>

{% if error %}<p class="caps accent mb-4">{{ error }}</p>{% endif %}

<form method="post" action="/admin/issues/{{ mag.id }}/edit" class="space-y-6 max-w-xl">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div>
    <label class="caps caps-soft block mb-1">Title</label>
    <input type="text" name="title" value="{{ mag.title }}" required class="field-small w-full">
  </div>
  <div>
    <label class="caps caps-soft block mb-1">Issue</label>
    <input type="text" name="issue" value="{{ mag.issue or '' }}" class="field-small w-full">
  </div>
  <div>
    <label class="caps caps-soft block mb-1">Publication date (YYYY-MM-DD)</label>
    <input type="text" name="publication_date"
           value="{{ mag.publication_date.isoformat() if mag.publication_date else '' }}"
           class="field-small w-full">
  </div>
  <div>
    <label class="caps caps-soft block mb-1">Publisher</label>
    <input type="text" name="publisher" value="{{ mag.publisher or '' }}" class="field-small w-full">
  </div>

  <div class="pt-2 flex items-baseline gap-6">
    <button type="submit" class="btn-editorial">Save changes</button>
    <a href="/admin/issues" class="link-italic">cancel</a>
  </div>
</form>
{% endblock %}
