{% extends "base.html" %}

{% block title %}Sign in · The Archive{% endblock %}

{% block content %}
<div class="max-w-md mx-auto pt-12">
  <p class="caps caps-soft mb-4">Restricted Area</p>
  <h1 class="display text-5xl mb-2">Sign in</h1>
  <p class="link-italic mb-8">The Archive is awaiting your credentials.</p>

  {% if error %}
    <p class="caps accent mb-6">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login" class="space-y-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next | default('/', true) }}">

    <div>
      <label class="caps caps-soft block mb-1" for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username"
             required autofocus class="field-small w-full">
    </div>

    <div>
      <label class="caps caps-soft block mb-1" for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password"
             required class="field-small w-full">
    </div>

    <div class="pt-4">
      <button type="submit" class="btn-editorial">Sign in</button>
    </div>
  </form>
</div>
{% endblock %}
