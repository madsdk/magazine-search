<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}The Archive{% endblock %}</title>

<link href="/static/fonts.css" rel="stylesheet">
<link href="/static/tailwind.css" rel="stylesheet">

<style>
  :root {
    --paper:      #f1e9d6;
    --paper-deep: #e6dcc1;
    --ink:        #1a140e;
    --ink-soft:   #5a4f44;
    --ink-faint:  #8a7e6e;
    --rule:       #1a140e;
    --accent:     #b32a1e;
    --accent-ink: #8a1f15;
  }

  html, body {
    background: var(--paper);
    color: var(--ink);
  }

  /* Subtle paper grain — a hand-drawn dot pattern, very low contrast. */
  body {
    font-family: "Newsreader", "Iowan Old Style", Georgia, serif;
    font-size: 17px;
    line-height: 1.55;
    font-feature-settings: "kern" 1, "liga" 1, "onum" 1;
    background-image:
      radial-gradient(rgba(26,20,14,0.04) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  .display {
    font-family: "Fraunces", "Times New Roman", serif;
    font-variation-settings: "opsz" 144, "SOFT" 30, "WONK" 1;
    font-weight: 700;
    letter-spacing: -0.022em;
    line-height: 0.92;
    color: var(--ink);
  }
  .display-italic {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
    font-weight: 500;
  }

  .caps {
    font-family: "Newsreader", Georgia, serif;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--ink);
  }
  .caps-soft { color: var(--ink-soft); }

  .rule       { border-top: 1px solid var(--rule); }
  .rule-thick { border-top: 4px solid var(--rule); }
  .rule-hair  { border-top: 1px solid var(--rule); opacity: 0.4; }

  .accent      { color: var(--accent); }
  .accent-bg   { background: var(--accent); color: var(--paper); }
  .accent-rule { border-color: var(--accent); }

  .ornament {
    color: var(--accent);
    font-style: normal;
    font-weight: 400;
  }

  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); }

  .dropcap::first-letter {
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-variation-settings: "opsz" 144, "SOFT" 30, "WONK" 1;
    font-size: 4.6em;
    float: left;
    line-height: 0.82;
    padding: 0.08em 0.12em 0 0;
    color: var(--accent);
  }

  /* Editorial search input — thick under-rule, italic placeholder. */
  .field-editorial {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--ink);
    font-family: "Fraunces", serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-variation-settings: "opsz" 60, "SOFT" 50;
    font-weight: 500;
    padding: 0.35rem 0 0.45rem;
    color: var(--ink);
  }
  .field-editorial:focus { outline: none; border-bottom-color: var(--accent); }
  .field-editorial::placeholder {
    font-style: italic;
    color: var(--ink-faint);
    font-weight: 400;
  }

  .field-small {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--ink);
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 0.95rem;
    padding: 0.2rem 0;
    color: var(--ink);
  }
  .field-small:focus { outline: none; border-bottom-color: var(--accent); }
  .field-small::placeholder { color: var(--ink-faint); }

  /* Tiny "go" button rendered as a typographic mark. */
  .mark-go {
    font-family: "Fraunces", serif;
    font-style: italic;
    color: var(--accent);
    font-size: 0.95rem;
    letter-spacing: 0.02em;
  }
  .mark-go:hover { text-decoration: underline; }

  /* Masthead title in the top strip. */
  .masthead-title {
    font-family: "Fraunces", serif;
    font-variation-settings: "opsz" 144, "SOFT" 30, "WONK" 1;
    font-weight: 800;
    letter-spacing: -0.01em;
    font-size: 1.7rem;
    line-height: 1;
  }

  /* Editorial highlight for FTS matches — a printer's mark, not a yellow stripe. */
  mark {
    background: rgba(179, 42, 30, 0.16);
    color: var(--ink);
    padding: 0 0.18em;
    border-radius: 0;
    font-weight: 500;
  }

  /* Publisher / filter chip. */
  .tag {
    font-family: "Newsreader", Georgia, serif;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.32rem 0.7rem;
    border: 1px solid var(--ink);
    color: var(--ink);
    display: inline-block;
    line-height: 1;
    background: transparent;
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .tag:hover { color: var(--accent); border-color: var(--accent); }
  .tag-active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .tag-active:hover { color: var(--paper); border-color: var(--ink); }

  /* Primary editorial button, used for search submit and the like. */
  .btn-editorial {
    font-family: "Newsreader", Georgia, serif;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.6rem 1.2rem;
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
    line-height: 1;
    cursor: pointer;
  }
  .btn-editorial:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--paper);
  }

  /* Quiet link styled as a typographic mark. */
  .link-italic {
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    color: var(--ink-soft);
  }
  .link-italic:hover { color: var(--accent); }

  .cover-frame {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--ink);
    box-shadow: 4px 5px 0 var(--paper-deep);
  }
  .cover-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Override Tailwind's aspect-[3/4] (which emits `aspect-ratio: 3/4`) with
     the classic padding-bottom percentage trick. The desktop build ships
     QtWebEngine 5.15 / Chromium 87, which predates CSS aspect-ratio
     (Chromium 88+) — without this the thumbnail containers collapse to
     0 height and covers disappear. The image is absolutely positioned so it
     fills the padded box regardless of content-area height. */
  .aspect-\[3\/4\] {
    aspect-ratio: auto;
    height: 0;
    padding-bottom: 133.333%;
  }
  .aspect-\[3\/4\] > img {
    position: absolute;
    top: 0;
    left: 0;
  }

  /* Label whose checkbox is locked-on by another option (e.g. all-terms when
     phrase-mode is on). Greyed and click-suppressed via JS. */
  label.opt-locked {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>

<body>

<header class="border-b border-[var(--ink)]">
  <div class="max-w-6xl mx-auto px-6 py-3 flex items-baseline justify-between gap-6">
    <div class="flex items-baseline gap-4">
      <a href="/" class="masthead-title">The Archive</a>
      <span class="caps caps-soft hidden sm:inline">a periodical index</span>
    </div>
    <div class="flex items-baseline gap-6">
      <nav class="caps flex gap-5">
        <a href="/magazines">Browse</a>
        <a href="/search">Search</a>
        {% if current_user() and current_user().is_admin %}
          <a href="{{ '/admin/issues' if not auth_enabled else '/admin' }}">Admin</a>
        {% endif %}
      </nav>
      <form action="/search" method="get" class="hidden md:flex items-baseline gap-3">
        <input type="text" name="q" value="{{ q | default('', true) }}"
               placeholder="Search…"
               class="field-small w-56">
        <button class="mark-go">go ↵</button>
      </form>
      {% if auth_enabled and current_user() %}
        <form method="post" action="/logout" class="caps caps-soft">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="link-italic">sign out</button>
        </form>
      {% endif %}
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-10">
{% block content %}{% endblock %}
</main>

<footer class="border-t border-[var(--ink)] mt-20">
  <div class="max-w-6xl mx-auto px-6 py-6 flex justify-between items-baseline caps caps-soft">
    <span>The Archive · vol. i</span>
    <span class="ornament">¤</span>
    <span>est. mmxxvi</span>
  </div>
</footer>

<script>
  // Forms that combine a checkbox with a same-name hidden=0 input (so an
  // unchecked box still submits a value) would otherwise serialize *both*
  // when the box is checked, producing ?x=0&x=1 in the URL. The server
  // resolves the last value correctly, but the URL is noisy. On submit,
  // disable the hidden twin whenever the checkbox is checked so each
  // name appears once.
  document.addEventListener("submit", function (e) {
    var form = e.target;
    if (!form || form.tagName !== "FORM") return;
    var cbs = form.querySelectorAll('input[type="checkbox"][name]');
    for (var i = 0; i < cbs.length; i++) {
      if (!cbs[i].checked) continue;
      var twins = form.querySelectorAll(
        'input[type="hidden"][name="' + cbs[i].name + '"]'
      );
      for (var j = 0; j < twins.length; j++) twins[j].disabled = true;
    }
  }, true);

  // "match in order" implies "all terms must match". When phrase is checked,
  // force the all-terms checkbox on and visually lock it; when phrase is
  // unchecked, release the lock.
  function syncMatchOptions(form) {
    var phrase = form.querySelector(
      'input[type="checkbox"][name="match_phrase"]'
    );
    var all = form.querySelector(
      'input[type="checkbox"][name="match_all"]'
    );
    if (!phrase || !all) return;
    if (phrase.checked) {
      all.checked = true;
      all.dataset.lockedByPhrase = "1";
      all.closest("label").classList.add("opt-locked");
    } else {
      delete all.dataset.lockedByPhrase;
      all.closest("label").classList.remove("opt-locked");
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    document
      .querySelectorAll('input[type="checkbox"][name="match_phrase"]')
      .forEach(function (cb) {
        cb.addEventListener("change", function () {
          syncMatchOptions(cb.form);
        });
        if (cb.form) syncMatchOptions(cb.form);
      });
    // Prevent toggling the all-terms checkbox while phrase mode locks it.
    document
      .querySelectorAll('input[type="checkbox"][name="match_all"]')
      .forEach(function (cb) {
        cb.addEventListener("click", function (e) {
          if (cb.dataset.lockedByPhrase === "1") e.preventDefault();
        });
      });
  });
</script>

</body>
</html>
